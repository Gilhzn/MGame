name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [claude/hybrid-rts-fps-prd-jpnymh]
    paths:
      - 'client/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

env:
  # 4.4+ required: 4.3 treats the "C#/.NET Android export is experimental"
  # warning as a fatal error in headless CLI exports.
  GODOT_VERSION: 4.4.1-stable

jobs:
  apk:
    name: Build debug APK (arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Godot (.NET edition) + export templates
        run: |
          set -euo pipefail
          curl -fsSL -o godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_mono_linux_x86_64.zip"
          unzip -q godot.zip -d "$HOME/godot"
          GODOT_BIN="$(find "$HOME/godot" -name 'Godot_v*_mono_linux.x86_64' -type f)"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

          curl -fsSL -o templates.tpz \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_mono_export_templates.tpz"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION/-/.}.mono"
          mkdir -p "$TEMPLATE_DIR"
          unzip -q templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* "$TEMPLATE_DIR/"
          echo "TEMPLATE_DIR=$TEMPLATE_DIR" >> "$GITHUB_ENV"

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$HOME/debug.keystore" \
            -alias androiddebugkey -storepass android -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Configure Godot editor settings (Android SDK + JDK)
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Build C# assemblies + import project (headless)
        working-directory: client
        run: |
          # Godot loads the game assembly from .godot/mono/temp/bin/Debug —
          # Godot.NET.Sdk redirects the build output there.
          dotnet build MGame.Client.csproj -c Debug
          "$GODOT_BIN" --headless --import . 2>&1 | tail -20 || true

      - name: Install Android gradle build template (required for .NET exports)
        working-directory: client
        run: |
          # Mirrors the editor's "Install Android Build Template" action:
          # unzip android_source.zip into res://android/build + version stamp.
          mkdir -p android/build
          unzip -q -o "$TEMPLATE_DIR/android_source.zip" -d android/build
          touch android/build/.gdignore
          echo "${GODOT_VERSION/-/.}.mono" > android/.build_version
          test -f android/build/build.gradle && echo "gradle template installed"

      - name: Export debug APK
        working-directory: client
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          "$GODOT_BIN" --headless --export-debug "Android" build/MGame-debug.apk 2>&1 | tee export.log
          # The exporter reports .NET packaging failures only as warnings —
          # a missing solution ships an APK without C# assemblies (instant
          # crash on launch). Treat them as hard errors.
          if grep -qiE "no solution file|Failed to build project|dotnet publish.*failed" export.log; then
            echo "::error::.NET assemblies were not packaged into the APK"
            exit 1
          fi
          ls -la build/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MGame-debug-apk
          path: client/build/MGame-debug.apk
          if-no-files-found: error

  smoke:
    name: Boot APK on Android emulator
    runs-on: ubuntu-latest
    needs: apk
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: MGame-debug-apk

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch app and verify it survives boot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          # NOTE: the runner executes each line as a separate `sh -c` — keep every command single-line.
          script: |
            adb install MGame-debug.apk
            adb logcat -c
            adb shell am start -n co.progis.overlord/com.godot.game.GodotApp
            sleep 30
            adb logcat -d > logcat.txt
            grep -iE "godot|overlord|FATAL|AndroidRuntime" logcat.txt | tail -40 || true
            adb shell pidof co.progis.overlord || { echo "::error::App process died within 30s of launch"; exit 1; }
            echo "App is alive after 30s."

      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-logcat
          path: logcat.txt
          if-no-files-found: ignore

  publish:
    name: Publish verified APK
    runs-on: ubuntu-latest
    needs: smoke
    steps:
      - uses: actions/checkout@v4
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: MGame-debug-apk
      - name: Publish as prerelease (stable download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create android-apk-test \
            --title "Android test APK" \
            --notes "Debug build from ${GITHUB_SHA} (emulator boot verified)" \
            --prerelease --target "${GITHUB_REF_NAME}" 2>/dev/null || true
          gh release upload android-apk-test MGame-debug.apk --clobber
