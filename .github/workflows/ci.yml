name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  server:
    name: Server & Sim (vitest + tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  client:
    name: Client CoreLogic (dotnet build + xunit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build client/MGame.Client.sln
      - run: dotnet test client/CoreLogic.Tests/CoreLogic.Tests.csproj --no-restore
